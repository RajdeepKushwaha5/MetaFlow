[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metaflow"
version = "0.1.0"
description = "MetaFlow — Multi-MCP Agent Orchestration Platform for OpenMetadata"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.0.0",
    "data-ai-sdk[langchain]>=0.1.2",
    "langgraph>=1.1.0",
    "langgraph-supervisor>=0.0.30",
    "langchain-google-genai>=2.1.0",
    "langchain>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
